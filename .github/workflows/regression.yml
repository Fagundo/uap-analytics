name: regression

# Reruns every committed hypothesis result from the current code and data and compares it value by value.
# A gate for the data refactor: nothing registered may move. One job per hypothesis, then a summary.

on:
  workflow_dispatch:
    inputs:
      record:
        description: "Write missing input fingerprints where results match"
        type: boolean
        default: false
      rebaseline:
        description: "Write regression baselines from this run (once; explain differences in BASELINE.md)"
        type: boolean
        default: false
      only:
        description: "One hypothesis id (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "17 11 * * 0"      # Sundays

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    env:
      PURSUE_EXPORT_TOKEN: ${{ secrets.PURSUE_EXPORT_TOKEN }}   # when configs/data_export.yaml has use: true
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        hypothesis: [H-geo-01, H-launch-01, H-celebrate-01, H-persist-01, H-install-01, H-volcano-01,
                     H-rockage-01, H-rocktype-01, H-rockera-01]
    steps:
      - name: Skip unless selected
        id: pick
        env:
          ONLY: ${{ inputs.only }}
          H: ${{ matrix.hypothesis }}
        run: |
          if [ -n "$ONLY" ] && [ "$ONLY" != "$H" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.pick.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.pick.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
        if: steps.pick.outputs.run == 'true'
      # Raw inputs are pinned per hypothesis: each rebaseline run saves exactly the files it used under a new
      # key, and later runs restore the newest such cache and never re-download them (live sources change: airports, quakes, volcanoes).
      - uses: actions/cache/restore@v4
        if: steps.pick.outputs.run == 'true'
        with:
          path: data/raw
          key: regression-raw-${{ matrix.hypothesis }}-v2-none
          restore-keys: |
            regression-raw-${{ matrix.hypothesis }}-v2-
            regression-raw-${{ matrix.hypothesis }}-v1
            raw-
      - uses: actions/cache/restore@v4
        if: steps.pick.outputs.run == 'true'
        with:
          path: data/raw/sgmc/*.npz
          key: sgmc-grids-v1-none
          restore-keys: sgmc-grids-v1-
      - name: Seed pinned live raw files (release pinned-raw-inputs-v2)
        if: steps.pick.outputs.run == 'true' && !inputs.rebaseline
        env:
          H: ${{ matrix.hypothesis }}
        run: uv run uap-analytics regression seed --only "$H"
      - name: Rerun and compare
        if: steps.pick.outputs.run == 'true'
        env:
          H: ${{ matrix.hypothesis }}
          RECORD: ${{ inputs.record }}
          REBASELINE: ${{ inputs.rebaseline }}
        run: |
          flags=""
          if [ "$RECORD" = "true" ]; then flags="$flags --record"; fi
          if [ "$REBASELINE" = "true" ]; then flags="$flags --rebaseline"; fi
          uv run uap-analytics regression run --only "$H" $flags
      - name: Pin the live raw files the new baselines used
        # always(): a rebaseline reports its differences from the registered result and exits 1, but the new
        # baselines are written and their raw files must be pinned
        if: always() && steps.pick.outputs.run == 'true' && inputs.rebaseline
        env:
          H: ${{ matrix.hypothesis }}
          GH_TOKEN: ${{ github.token }}
        run: uv run uap-analytics regression pin --only "$H"
      - uses: actions/cache/save@v4
        if: always() && steps.pick.outputs.run == 'true' && inputs.rebaseline
        with:
          path: data/raw
          key: regression-raw-${{ matrix.hypothesis }}-v2-${{ github.run_id }}   # caches can't be overwritten; newest wins on restore
      - uses: actions/upload-artifact@v4
        if: always() && steps.pick.outputs.run == 'true'
        with:
          name: regression-${{ matrix.hypothesis }}
          path: |
            results/regression/parts/${{ matrix.hypothesis }}.json
            results/${{ matrix.hypothesis }}/*/fingerprint.json
            results/${{ matrix.hypothesis }}/*/regression_baseline.json
          if-no-files-found: warn

  summary:
    needs: rerun
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          pattern: regression-*
          path: results
          merge-multiple: true
      - name: Summarize
        id: sum
        run: |
          set +e
          uv run uap-analytics regression summarize
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat results/regression/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report and fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/regression results/H-*/*/fingerprint.json results/H-*/*/regression_baseline.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Regression check: ${{ steps.sum.outputs.status == '0' && 'all results unchanged' || 'differences found' }}"
          git pull --rebase -X theirs && git push     # this run's files win over an older run's
      - name: Fail if anything changed
        if: steps.sum.outputs.status != '0'
        run: exit 1
