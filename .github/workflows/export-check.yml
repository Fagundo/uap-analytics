name: export check

# Phase 4 gate, part 1: PURSUE's published export (configs/pursue_export.yaml), read through ExportTables,
# must give the same NUFORC reports, launches, Kp and quakes as uap-geo's own loaders on its pinned raw files.
# Needs the PURSUE_EXPORT_TOKEN secret (read-only access to the private PURSUE repo). Commits counts and
# hashes only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["configs/pursue_export.yaml", "src/uap_geo/data/scraping/pursue_export.py", "src/uap_geo/regression/export_check.py"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PURSUE_EXPORT_TOKEN: ${{ secrets.PURSUE_EXPORT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Token present
        run: '[ -n "$PURSUE_EXPORT_TOKEN" ] || { echo "::error::Set the PURSUE_EXPORT_TOKEN secret"; exit 1; }'
      # NUFORC and GCAT from H-launch-01's pinned cache, Kp and M3 quakes from H-geo-01's (same NUFORC bytes)
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: regression-raw-H-launch-01-v2-none
          restore-keys: |
            regression-raw-H-launch-01-v2-
            regression-raw-H-launch-01-v1
      - run: mkdir -p "$RUNNER_TEMP/keep" && cp -r data/raw/nuforc data/raw/gcat_launches "$RUNNER_TEMP/keep/" && rm -rf data/raw
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: regression-raw-H-geo-01-v2-none
          restore-keys: |
            regression-raw-H-geo-01-v2-
            regression-raw-H-geo-01-v1
      - run: rm -rf data/raw/gcat_launches && cp -r "$RUNNER_TEMP/keep/gcat_launches" data/raw/ && sha256sum data/raw/nuforc/*.csv "$RUNNER_TEMP"/keep/nuforc/*.csv
      - name: Compare
        run: uv run uap-geo regression export-check
      - name: Commit the check (counts and hashes only)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/regression/export_check.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Regression: PURSUE export vs uap-geo's own loaders"
          git pull --rebase --autostash -X theirs && git push
